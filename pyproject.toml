[project]
name = "pharmadoc-ai"
version = "0.1.0"
description = "Local, evidence-grounded intelligence for synthetic healthcare documents"
readme = "README.md"
authors = [
    { name = "Soubhagya Jain", email = "jainsoubhagya632@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pymupdf==2.0",
    "pytesseract==0.3.13",
    "python-multipart==0.0.33",
    "scikit-learn==1.9.1",
    "spacy==3.8.18",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
]

[project.scripts]
pharmadoc-ai = "pharmadoc_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires locally installed OCR or model engines"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
